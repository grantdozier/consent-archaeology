# Invariant checks — the rules from DESIGN.md §1, enforced by CI rather than vibes.
#
# These are not style checks. Each one maps to a rule that, if broken, turns a
# privacy tool into the thing it exists to fight. A PR that trips any of them
# does not merge.
name: invariants

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── R1 — No Social Security Numbers, ever ───────────────────────────────
      # A public repo that collects SSNs behind a dramatic UI is a phishing kit,
      # regardless of intent. The only permitted matches are the intake
      # REJECTION logic in worker/src/routes/intake.js.
      - name: 'R1 — no SSN collection'
        run: |
          echo "Scanning for SSN input fields..."
          if grep -rniE '<input[^>]*ssn|name=["'"'"']?ssn|social_security|ssn_' docs/ worker/src/ \
               --exclude=intake.js; then
            echo "::error::R1 VIOLATION — an SSN field was introduced. See DESIGN.md §1 R1."
            exit 1
          fi
          echo "OK — no SSN input anywhere."

      # ── R2 — Never claim we delete anything ─────────────────────────────────
      # We generate and transmit demands; we do not erase data from the
      # internet. Nobody can. Since the project accepts donations, claiming
      # otherwise is a paid-service misrepresentation (FTC Act §5).
      - name: 'R2 — no deletion claims in user-facing copy'
        run: |
          echo "Scanning user-facing copy for banned claim verbs..."
          if grep -rniE '\b(destroy|erase|wipe|nuke|scrub)\b|guaranteed removal|remove you from the internet' \
               docs/*.html docs/assets/; then
            echo "::error::R2 VIOLATION — user-facing copy claims deletion. Use: demand, compel, request, file, document, track, escalate. See DESIGN.md §1 R2."
            exit 1
          fi
          echo "OK — no deletion claims."

      # ── R3 — The verified-self gate is the anti-doxing control ──────────────
      # Every route that touches a dossier must gate on requireSession(), and
      # sessions may be minted in exactly one place: redeeming a magic link.
      # Without this, a public repo + "give me a name" = a stalking tool.
      - name: 'R3 — verified-self gate intact'
        run: |
          for r in sweep dossier demand evidence donate; do
            if ! grep -q 'requireSession(request, env)' "worker/src/routes/$r.js"; then
              echo "::error::R3 VIOLATION — worker/src/routes/$r.js does not gate on requireSession(). See DESIGN.md §1 R3."
              exit 1
            fi
          done
          if grep -rniE 'skipauth|allowUnverified|NO_AUTH|DEBUG_SKIP' worker/src/ --include='*.js' \
               | grep -v '^\S*:[0-9]*: *[/*]'; then
            echo "::error::R3 VIOLATION — an auth bypass was introduced."
            exit 1
          fi
          echo "OK — all dossier routes gated, no bypass."

      # ── R4 — Allowlist-only crawling ────────────────────────────────────────
      # Firecrawl may only ever be pointed at brokers.js entries. An open-web
      # crawl over a person's name is a different product with a different name.
      - name: 'R4 — allowlist validator present'
        run: |
          if ! grep -q 'assertAllowlistedUrl' worker/src/brokers.js; then
            echo "::error::R4 VIOLATION — the allowlist validator is missing from brokers.js."
            exit 1
          fi
          if ! grep -q 'assertAllowlistedUrl' worker/src/routes/sweep.js; then
            echo "::error::R4 VIOLATION — sweep.js no longer validates URLs against the allowlist."
            exit 1
          fi
          echo "OK — allowlist enforced at definition and call site."

      # ── Generated templates must match legal/ ───────────────────────────────
      # legal/templates/*.md is reviewed as legal text and is canonical.
      # worker/src/templates.js is a build artifact. If they drift, the deployed
      # letters stop matching the reviewed text — which is how a project like
      # this ends up mailing a citation nobody approved.
      - name: 'templates match legal/ source of truth'
        run: |
          node worker/scripts/build-templates.mjs
          if ! git diff --quiet -- worker/src/templates.js; then
            echo "::error::worker/src/templates.js is stale. Run: node worker/scripts/build-templates.mjs"
            git diff --stat -- worker/src/templates.js
            exit 1
          fi
          echo "OK — generated templates match legal/."

      - name: 'JavaScript parses'
        run: |
          find worker/src worker/scripts docs/assets -name '*.js' -o -name '*.mjs' \
            | while read -r f; do node --check "$f" || exit 1; done
          echo "OK — all JS parses."
