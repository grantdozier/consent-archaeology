# Deploys docs/ to GitHub Pages on every push to the default branch.
# Repo Settings → Pages → Source must be set to "GitHub Actions" (see DEPLOY.md §1).

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, mint the OIDC token
# that deploy-pages uses to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight production deploy finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step — docs/ is the site (vanilla JS, per DESIGN.md §7).
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
